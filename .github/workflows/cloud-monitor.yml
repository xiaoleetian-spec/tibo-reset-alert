name: Cloud monitor experiment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-monitor.yml"
      - "scripts/cloud-monitor*.mjs"
      - "tests/cloud-monitor.test.mjs"
      - "tests/fixtures/cloud-timeline.json"
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use the bundled fixture without X or GitHub writes"
        required: true
        default: true
        type: boolean

concurrency:
  group: tibo-cloud-monitor
  cancel-in-progress: false

jobs:
  fixture-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test cloud monitor
        run: node --test tests/cloud-monitor.test.mjs
      - name: Exercise the complete dry-run command
        run: node scripts/cloud-monitor.mjs --dry-run --fixture=tests/fixtures/cloud-timeline.json

  monitor:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_CLOUD_MONITOR == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fixture dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node scripts/cloud-monitor.mjs --dry-run --fixture=tests/fixtures/cloud-timeline.json
      - name: Live X check
        if: github.event_name == 'schedule' || inputs.dry_run != true
        run: node scripts/cloud-monitor.mjs
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
      - name: Save cursor and archive
        if: success() && (github.event_name == 'schedule' || inputs.dry_run != true)
        shell: bash
        run: |
          if git diff --quiet -- monitor-data; then
            echo "No new state to save."
            exit 0
          fi
          git config user.name "Tibo RESET Monitor"
          git config user.email "noreply@users.noreply.github.com"
          git add monitor-data
          git commit -m "chore: update cloud monitor cursor [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
